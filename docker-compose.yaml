services:
  web:
    build: ./web
    ports: ["5173:5173"]
    environment:
      VITE_GATEWAY_URL: http://localhost:8080
    depends_on: [api-gateway]
  api-gateway:
    build: ./api-gateway
    ports: ["8080:8080"]
    environment:
      BOOKING_API_URL: http://booking-api:8000
    depends_on: [booking-api]
  booking-api:
    build: ./booking-api
    ports: ["8000:8000"]
    environment:
      DATABASE_HOST: postgres
      REDIS_HOST: redis
      EXTERNAL_CALENDAR_URL: http://wiremock:8080
    depends_on: [postgres, redis, wiremock]
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: booking, POSTGRES_USER: booking, POSTGRES_PASSWORD: booking }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U booking -d booking"], interval: 5s, timeout: 3s, retries: 20 }
  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }
  wiremock:
    image: wiremock/wiremock:3.9.1
    ports: ["8089:8080"]
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
      - ./wiremock/__files:/home/wiremock/__files:ro
